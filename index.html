<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Sheet Dashboard</title>

  <!-- Evitar cache -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/main.js" defer></script>
</head>

<body>
  <header class="header">
    <div class="header-left">
      <!-- Si no tienes logo, borra esta línea o sube img/bitel_logo.png -->
      <img src="img/bitel_logo.png" alt="Logo" />

      <div class="title-wrap">
        <div class="title">Live Sheet Dashboard</div>
        <div class="subtitle">Datos desde Google Sheets (CSV) con auto-actualización</div>
      </div>
    </div>

    <!-- Derecha: enlace a sheet + fecha -->
    <div style="display:flex; align-items:center; gap:12px;">
      <a
        id="btnOpenSheet"
        class="btn header-btn"
        href="https://docs.google.com/spreadsheets/d/1t6MH60weJzUU30DJZ1s3tjhOtjsX1IqersjEL15roZs/edit?usp=sharing"
        target="_blank"
        rel="noopener noreferrer"
        style="text-decoration:none;"
      >
        Open Excel (editable)
      </a>

      <div class="muted" style="white-space:nowrap;">
        <b>Last update:</b> <span id="lastUpdate">—</span>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- (CONFIG eliminado) -->

    <section class="section">
      <h2>DATA</h2>
      <div class="hint">Secciones automáticas según Columna A (subtítulos).</div>

      <!-- Aquí se renderizan las secciones dinámicas -->
      <div id="sections"></div>

      <!-- Status mínimo (opcional, lo dejo por si hay error/filas) -->
      <div class="muted" style="margin-top:12px;">
        <div><b>Rows:</b> <span id="rowCount">0</span></div>
        <div><b>Auto refresh:</b> <span id="refreshInfo">—</span></div>
      </div>

      <div id="errorBox" class="muted"
           style="margin-top:10px; display:none; color:#7a1f1f; font-weight:700;">
        Error: <span id="errorText"></span>
      </div>
    </section>

    <div class="footer">© Live Sheet · Auto refresh</div>
  </main>
</body>
</html>
